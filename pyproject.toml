[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detector"
version = "0.1.0"
authors = [
    {name="Sofiia", email="sofiyka.denisenko@mail.ru"},
]
description = "Unified anomaly detection library with preprocessing and visualization"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/soy5of/anomaly-detector"