[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detector"
version = "1.0.0"
authors = [
    {name="Sofiia", email="sofiyka.denisenko@mail.ru"}
]
description = "Unified anomaly detection library with preprocessing and visualization"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "pyyaml = ^6.0"
    "pydantic = ^1.9.0"
]

[project.urls]
Homepage = "https://github.com/soy5of/anomaly-detector"
Repository = "https://github.com/soy5of/anomaly-detector"
Bug_Tracker = "https://github.com/soy5of/anomaly-detector/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["anomaly_detector*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
anomaly_detector = ["config.yaml"]